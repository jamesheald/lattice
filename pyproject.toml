[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice"
version = "0.1.0"
description = "A Python package for lattice computations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "James Heald", email = "your.email@example.com" }]
dependencies = [
    # Same as above
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov"]
dev = ["black", "flake8"]

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]
include = ["data/*"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
managed = true
